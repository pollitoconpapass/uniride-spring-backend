spring:
  application:
    name: uniride

  ai:
    openai:
      api-key: ${GROQ_API_KEY}
      base-url: https://api.groq.com/openai/v1
      chat:
        model: openai/gpt-oss-120b
        temperature: 0.1
        replay-reasoning-content: false

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect # -> Dialect: Tipo de lenguaje de SQL (PostgreSQL, MySQL, Oracle, etc.)

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_ADDRESS:}
    password: ${EMAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          starttls:
            enable: true
            required: true

  flyway:
    baseline-on-migrate: false
    clean-disabled: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

uniride:
  jwt:
    secret: ${JWT_SECRET}
    expiracion-ms: 86400000
  ocr:
    idioma: spa+eng
    tessdata:

server:
  address: 0.0.0.0
  port: ${PORT:8080}
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  servlet:
    context-path: /api

springdoc:
  enable-data-rest: false
