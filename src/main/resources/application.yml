spring:
  application:
    name: uniride

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/uniride}
    username: ${DB_USERNAME:postgres}
    password: ${POSTGRES_PASSWORD}
    
  jpa:
    hibernate:
      ddl-auto: update # -> ddl: Sentencias de definicion de datos (Definition Data Language)
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect # -> Dialect: Tipo de lenguaje de SQL (PostgreSQL, MySQL, Oracle, etc.)

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_ADDRESS:}
    password: ${EMAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

uniride:
  jwt:
    secret: ${JWT_SECRET}
    expiracion-ms: 86400000
  ocr:
    idioma: spa+eng
    tessdata:

server:
  address: 0.0.0.0
  port: ${PORT:8080}
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  servlet:
    context-path: /api

springdoc:
  enable-data-rest: false
