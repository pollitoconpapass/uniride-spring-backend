spring:
  application:
    name: uniride

  datasource:
    url: jdbc:postgresql://localhost:5432/uniride
    username: postgres
    password: adminadmin

  jpa:
    hibernate:
      ddl-auto: update # -> ddl: Sentencias de definicion de datos (Definition Data Language)
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect # -> Dialect: Tipo de lenguaje de SQL (PostgreSQL, MySQL, Oracle, etc.)

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_ADDRESS:}
    password: ${EMAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

uniride:
  jwt:
    secret: qlINUWVDUUnHDEaKxOC9NhklhoMxIjKSveeUaLsp59k=
    expiracion-ms: 86400000
  ocr:
    idioma: spa+eng
    tessdata:

server:
  port: 8080
  servlet:
    context-path: /api
