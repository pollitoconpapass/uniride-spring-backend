name: Backend verification
on:
  pull_request:
  push:
    branches: [fix/backend-hardening-final]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: uniride_audit
          POSTGRES_PASSWORD: uniride_ephemeral_test_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d uniride_audit"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      UNIRIDE_TEST_PG_URL: jdbc:postgresql://localhost:5432/uniride_audit
      UNIRIDE_TEST_PG_PASSWORD: uniride_ephemeral_test_only
      TZ: America/Lima
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw --batch-mode clean verify
      - run: ./mvnw --batch-mode -Ppostgres-it test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: target/surefire-reports
